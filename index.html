.lg{font:800 18px 'Bricolage Grotesque';letter-spacing:-.01em}
.nl{display:flex;gap:2px}.nl a{padding:8px 13px;border-radius:20px;font-size:13px;opacity:.78;transition:background .2s}.nl a.on,.nl a:hover{background:rgba(15,16,20,.08);opacity:1}

.gpg .mu{margin-top:-10px}.gch{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}.gch button{height:40px;padding:0 18px;border-radius:999px;background:#fff;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--ln)}.gch button.on{background:var(--ink);color:#fff}

.gbd2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}.gbig{border-radius:20px;overflow:hidden}.gbig .cvimg{border-radius:20px}.ginf h2{font-size:30px;margin:10px 0 4px}.gds{margin:12px 0;font-size:14px;line-height:1.5}.gtot{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:14px}.gtot b{font-size:30px}.gact{display:flex;gap:10px;flex-wrap:wrap}.gact .btn{flex:1 1 150px}.gshop{margin-top:16px;background:var(--bg);border-radius:18px;padding:12px 14px}.gshop .rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.gov{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 45%,#2a1d5c,#0b0a1a 70%);color:#fff;display:grid;place-items:center;overflow:hidden}.gst{position:relative;width:min(760px,100%);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.gov.fast .gs.c{filter:blur(2px)}@media(max-width:700px){.gs.l,.gs.r{display:none}}
.gmsg{z-index:1;font-weight:600;letter-spacing:.5px;margin-top:6px}.gnm{z-index:1;font-size:26px;min-height:32px}.gfl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.gfl.on{animation:gflash .8s ease-out}

@media(max-width:800px){.gbd2{grid-template-columns:1fr}.gbtn{width:100%}.ginf h2{font-size:24px}}@media(prefers-reduced-motion:reduce){.gbeam{animation:none!important}}

/* ---- admin theme: dark glass over an animated light-strand backdrop (CSS stand-in for a looping video) ---- */
body.adm{--ink:#fff;--mu:#a2a9b8;--ln:rgba(196,214,232,.22);background:#02060f;color:#fff;font-family:Sora,Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

body.adm::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(140% 60% at 50% 40%,rgba(6,10,18,.55) 0%,rgba(6,10,18,.22) 55%,rgba(6,10,18,.5) 100%)}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.08)}}

async function svShrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw new Error('mime');
var big=f.size>1500000,bmp=null;try{if(window.createImageBitmap)bmp=await createImageBitmap(f)}catch(x){bmp=null}
if(!bmp){if(f.size>5000000)throw new Error('too large');return{blob:f,type:f.type,ext:f.type.split('/')[1].replace('jpeg','jpg')}}
var m=Math.max(bmp.width,bmp.height),sc=m>1600?1600/m:1;if(sc==1&&!big){if(bmp.close)bmp.close();return{blob:f,type:f.type,ext:f.type.split('/')[1].replace('jpeg','jpg')}}
var c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
var b=await new Promise(function(res){c.toBlob(res,'image/jpeg',0.86)});if(!b)throw new Error('mime');if(b.size>5000000)throw new Error('too large');return{blob:b,type:'image/jpeg',ext:'jpg'}}
function svRand(){var a=new Uint8Array(8);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}

for(var k=0;k<files.length;k++){var pos=-1;for(var q=0;q<8;q++)if(used.indexOf(q)<0){pos=q;break}if(pos<0){toast('Up to 8 photos per product');break}
var s=await svShrink(files[k]),path=SV.sid+'/'+e.id+'/'+svRand()+'.'+s.ext;
var up=await sb.storage.from('product-images').upload(path,s.blob,{contentType:s.type,upsert:false});if(up.error)throw up.error;
var r=await sb.from('product_images').insert({product_id:e.id,storage_path:path,position:pos,is_primary:!have.some(function(i){return i.is_primary})&&n==0&&!have.length});
